plugins {
    id 'fabric-loom' version '1.12.7'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    accessWidenerPath = file("src/main/resources/rockstar.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly files('libs/mixinextras-fabric-0.4.1.jar')
    compileOnly 'org.projectlombok:lombok:1.18.36'

    implementation 'ai.catboost:catboost-prediction:1.2.7'
    include 'ai.catboost:catboost-prediction:1.2.7'

    implementation 'com.google.zxing:core:3.5.3'
    include 'com.google.zxing:core:3.5.3'

    implementation('com.google.zxing:javase:3.5.3') {
        transitive = false
    }
    include('com.google.zxing:javase:3.5.3') {
        transitive = false
    }

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    include 'org.nanohttpd:nanohttpd:2.3.1'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
